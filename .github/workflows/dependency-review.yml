name: Dependency review

# On every pull request: blocks a change that adds a dependency with a
# known vulnerability (moderate or worse) or a licence incompatible with
# the GPL-3.0 this project is released under.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, SSPL-1.0, BUSL-1.1
          comment-summary-in-pr: on-failure
