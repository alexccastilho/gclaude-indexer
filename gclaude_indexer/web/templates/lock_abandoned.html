{% extends "base.html" %}
{% block title %}{{ t('lock.abandoned_title') }} — {{ t('app.name') }}{% endblock %}
{% block content %}
<h1>{{ t('lock.abandoned_title') }}</h1>
<div class="errors">
  <p>{{ t(message_key, **message_params) }}</p>
</div>
<form method="post" action="/projects/{{ project.id }}/take-lock">
  <button type="submit" class="button button-primary">{{ t('lock.take_over') }}</button>
</form>
<p><a href="/projects" class="button">&larr; {{ t('lock.back_without_taking_over') }}</a></p>
{% endblock %}
